# nginx для VPS reg.ru: /etc/nginx/sites-available/biohimmash.conf
# Главный домен — нппбиохиммаш.рф (xn--80abvauackga3exb.xn--p1ai), nppbiohimmash.ru → 301 на него.
# SSL: certbot --nginx -d xn--80abvauackga3exb.xn--p1ai -d www.xn--80abvauackga3exb.xn--p1ai -d nppbiohimmash.ru -d www.nppbiohimmash.ru

upstream biohimmash_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS для всех доменов
server {
    listen 80;
    listen [::]:80;
    server_name xn--80abvauackga3exb.xn--p1ai www.xn--80abvauackga3exb.xn--p1ai nppbiohimmash.ru www.nppbiohimmash.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://xn--80abvauackga3exb.xn--p1ai$request_uri; }
}

# Второй домен и www → 301 на главный
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.xn--80abvauackga3exb.xn--p1ai nppbiohimmash.ru www.nppbiohimmash.ru;

    ssl_certificate     /etc/letsencrypt/live/xn--80abvauackga3exb.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80abvauackga3exb.xn--p1ai/privkey.pem;

    return 301 https://xn--80abvauackga3exb.xn--p1ai$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--80abvauackga3exb.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80abvauackga3exb.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80abvauackga3exb.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 14m;   # загрузка изображений в админке (лимит приложения — 12 МБ)

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/rss+xml application/xml image/svg+xml;

    # Загруженные медиа — напрямую с диска (MEDIA_DIR), минуя Node
    location /media/ {
        alias /var/www/biohimmash/media/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Хэшированная статика Next
    location /_next/static/ {
        proxy_pass http://biohimmash_next;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://biohimmash_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
